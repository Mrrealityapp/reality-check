<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reality Check – Coming Soon</title>

  <style>
    /* Reset */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #ffffff;
      text-align: center;
    }

    /* Night sky background */
    body {
      background: radial-gradient(circle at top, #1a1a2e, #0a0a0f);
      position: relative;
    }

    /* Stars */
    .stars {
      width: 2px;
      height: 2px;
      background: white;
      box-shadow:
        100px 200px white,
        300px 400px white,
        500px 100px white,
        700px 300px white,
        900px 150px white,
        1100px 350px white,
        1300px 250px white,
        1500px 450px white;
      animation: twinkle 4s infinite alternate;
      position: absolute;
      top: 0;
      left: 0;
    }

    @keyframes twinkle {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    /* Shooting star */
    .shooting-star {
      position: absolute;
      top: -10px;
      left: -200px;
      width: 3px;
      height: 3px;
      background: white;
      box-shadow: 0 0 10px white;
      animation: shoot 5s linear infinite;
    }

    @keyframes shoot {
      0% { transform: translate(0, 0) rotate(45deg); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translate(800px, 800px) rotate(45deg); opacity: 0; }
    }

    /* Center content */
    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 600px;
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 10px #a259ff);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #a259ff;
      text-shadow: 0 0 10px #a259ff;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="stars"></div>
  <div class="shooting-star"></div>

  <div class="content">
    <img src="images/realitychecklogo.png" class="logo" alt="Reality Check Logo">
    <h1>Reality Check</h1>
    <p>Our full site is being built right now.<br>
    We’re getting everything ready to launch something powerful, transparent, and built to help people who need it most.</p>
    <p>Thank you for your patience.</p>
  </div>
</body>
</html>
