<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reality Check – Coming Soon</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #ffffff;
      text-align: center;
    }

    /* Full-screen desert night sky */
    body {
      background: url('images/desertsky.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Dark overlay for readability */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      top: 50%;
      transform: translateY(-50%);
      width: 90%;
      max-width: 600px;
      margin: 0 auto;
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 12px #a259ff);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #a259ff;
      text-shadow: 0 0 12px #a259ff;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="content">
    <img src="images/realitychecklogo.png" class="logo" alt="Reality Check Logo">
    <h1>Reality Check</h1>
    <p>Our full site is being built right now.<br>
    We’re getting everything ready to launch something powerful, transparent, and built to help people who need it most.</p>
    <p>Thank you for your patience.</p>
  </div>
</body>
</html>
