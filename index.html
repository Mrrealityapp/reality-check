<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reality Check – Coming Soon</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #ffffff;
      text-align: center;
      background: #000;
    }

    /* Starfield */
    .stars, .stars:after {
      position: absolute;
      top: 0;
      left: 0;
      width: 2000px;
      height: 2000px;
      background: transparent url("https://raw.githubusercontent.com/VincentGarreau/particles.js/master/demo/img/stars.png") repeat;
      animation: drift 200s linear infinite;
    }

    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-1000px); }
    }

    /* Shooting stars */
    .shooting-star {
      position: absolute;
      width: 2px;
      height: 80px;
      background: linear-gradient(white, rgba(255,255,255,0));
      opacity: 0.8;
      transform: rotate(45deg);
      animation: shoot 3s linear infinite;
    }

    @keyframes shoot {
      0% { transform: translate(-200px, -200px) rotate(45deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translate(1000px, 1000px) rotate(45deg); opacity: 0; }
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      top: 50%;
      transform: translateY(-50%);
      width: 90%;
      max-width: 600px;
      margin: 0 auto;
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 12px #a259ff);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #a259ff;
      text-shadow: 0 0 12px #a259ff;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="stars"></div>
  <div class="stars" style="animation-delay: -100s;"></div>

  <div class="shooting-star" style="top: 20%; left: 10%; animation-delay: 1s;"></div>
  <div class="shooting-star" style="top: 40%; left: 50%; animation-delay: 2.5s;"></div>
  <div class="shooting-star" style="top: 70%; left: 30%; animation-delay: 4s;"></div>

  <div class="overlay"></div>

  <div class="content">
    <img src="images/realitychecklogo.png" class="logo" alt="Reality Check Logo">
    <h1>Reality Check</h1>
    <p>Our full site is being built right now.<br>
    We’re getting everything ready to launch something powerful, transparent, and built to help people who need it most.</p>
    <p>Thank you for your patience.</p>
  </div>
</body>
</html>
