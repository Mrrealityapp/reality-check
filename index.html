<!DOCTYPE html>
<html lang="en">
<head>

      font-size: 3.2em;
      margin-bottom: 0.4em;
      letter-spacing: 1px;

    p {
      font-size: 1.25em;
      max-width: 650px;
      margin: 0 auto 1.5em;
      line-height: 1.5em;
    }

    .footer {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
