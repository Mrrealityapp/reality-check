<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reality Check</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0d001a;
      color: white;
      text-align: center;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: #1a0033;
    }
    header img.logo {
      height: 60px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }
    .hero {
      padding: 60px 20px;
    }
    .hero img.charlie {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      box-shadow: 0 0 30px #8000ff;
      object-fit: cover;
    }
    .paypal-buttons {
      margin-top: 40px;
    }
    .paypal-buttons button {
      background-color: #8000ff;
      color: white;
      border: none;
      padding: 15px 30px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    footer {
      margin-top: 60px;
      padding: 20px;
      background-color: #1a0033;
    }
    footer img.logo {
      height: 40px;
    }
  </style>
</head>
<body>

  <header>
    <img src="images/logo/reality-check-logo.png" alt="Reality Check Logo" class="logo" />
    <nav>
      <a href="#">HOME</a>
      <a href="#">ABOUT</a>
    </nav>
  </header>

  <section class="hero">
    <img src="images/charlie/charlie-circle.png" alt="Charlie the Cat" class="charlie" />
    <h1>Reality Check</h1>
    <p>Helping communities distinguish real from fake with transparent trust scores.</p>

    <div class="paypal-buttons">
      <button onclick="window.location.href='https://www.paypal.com/donate?hosted_button_id=YOUR_BUTTON_ID'">Donate</button>
      <button onclick="window.location.href='https://www.paypal.com/donate?hosted_button_id=YOUR_MONTHLY_ID'">Donate Monthly</button>
    </div>
  </section>

  <footer>
    <img src="images/logo/reality-check-logo.png" alt="Reality Check Logo" class="logo" />
    <p>&copy; 2025 Reality Check. All rights reserved.</p>
  </footer>

</body>
</html>
