<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reality Check – Coming Soon</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      color: #fff;
      text-align: center;
    }

    /* REALISTIC STARFIELD */
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Overlay for readability */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      top: 50%;
      transform: translateY(-50%);
      width: 90%;
      max-width: 600px;
      margin: 0 auto;
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 12px #a259ff);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #a259ff;
      text-shadow: 0 0 12px #a259ff;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <canvas id="stars"></canvas>
  <div class="overlay"></div>

  <div class="content">
    <img src="images/realitychecklogo.png" class="logo" alt="Reality Check Logo">
    <h1>Reality Check</h1>
    <p>Our full site is being built right now.<br>
    We’re getting everything ready to launch something powerful, transparent, and built to help people who need it most.</p>
    <p>Thank you for your patience.</p>
  </div>

  <script>
    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.onresize = resize;

    const stars = [];
    const starCount = 400;

    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2,
        twinkle: Math.random() * 0.5
      });
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";

      stars.forEach(s => {
        s.twinkle += (Math.random() - 0.5) * 0.05;
        const brightness = 0.7 + Math.sin(s.twinkle) * 0.3;

        ctx.globalAlpha = brightness;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.globalAlpha = 1;
    }

    function shootingStar() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height * 0.5;

      let length = 0;
      const maxLength = 300;

      function animate() {
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + length, y + length);
        ctx.stroke();

        length += 10;

        if (length < maxLength) {
          requestAnimationFrame(animate);
        }
      }

      animate();
    }

    setInterval(() => {
      if (Math.random() < 0.3) shootingStar();
    }, 2000);

    function loop() {
      drawStars();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
