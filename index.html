<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reality Check – Coming Soon</title>

  <style>
    /* Reset */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #ffffff;
      text-align: center;
      background: #000000;
    }

    /* Container for the whole scene */
    .sky {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }

    /* Star layers for depth */
    .stars,
    .stars2,
    .stars3 {
      position: absolute;
      top: 0;
      left: 0;
      width: 2000px;
      height: 2000px;
      background: transparent;
    }

    /* Base starfield using box-shadow for hundreds of stars */
    .stars::after,
    .stars2::after,
    .stars3::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 2px;
      height: 2px;
      background: transparent;
      box-shadow:
        50px 100px #ffffff,
        120px 340px #ffffff,
        200px 800px #ffffff,
        320px 640px #ffffff,
        450px 220px #ffffff,
        520px 900px #ffffff,
        610px 150px #ffffff,
        700px 480px #ffffff,
        820px 720px #ffffff,
        930px 310px #ffffff,
        1040px 850px #ffffff,
        1150px 430px #ffffff,
        1260px 120px #ffffff,
        1370px 690px #ffffff,
        1480px 540px #ffffff,
        1590px 260px #ffffff,
        1700px 880px #ffffff,
        1800px 360px #ffffff,
        1900px 760px #ffffff,
        200px 200px #ffffff,
        300px 500px #ffffff,
        400px 300px #ffffff,
        600px 700px #ffffff,
        800px 200px #ffffff,
        1000px 600px #ffffff,
        1200px 400px #ffffff,
        1400px 800px #ffffff,
        1600px 100px #ffffff,
        1800px 500px #ffffff;
      opacity: 0.9;
    }

    /* Parallax drift for depth */
    .stars {
      animation: drift1 120s linear infinite;
    }

    .stars2 {
      transform: scale(1.3);
      opacity: 0.7;
      animation: drift2 180s linear infinite;
    }

    .stars3 {
      transform: scale(1.6);
      opacity: 0.5;
      animation: drift3 240s linear infinite;
    }

    @keyframes drift1 {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-200px, -200px, 0); }
    }

    @keyframes drift2 {
      from { transform: translate3d(0, 0, 0) scale(1.3); }
      to { transform: translate3d(-300px, -150px, 0) scale(1.3); }
    }

    @keyframes drift3 {
      from { transform: translate3d(0, 0, 0) scale(1.6); }
      to { transform: translate3d(-150px, -300px, 0) scale(1.6); }
    }

    /* Shooting stars */
    .shooting-star {
      position: absolute;
      top: -50px;
      left: -200px;
      width: 3px;
      height: 3px;
      background: #ffffff;
      box-shadow: 0 0 15px #ffffff;
      border-radius: 50%;
      opacity: 0;
      animation: shoot 4s linear infinite;
    }

    .shooting-star::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120px;
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0), #ffffff);
      transform: rotate(0deg);
    }

    /* Multiple shooting stars with different timings and angles */
    .shooting-star:nth-child(4) {
      top: 10%;
      left: -10%;
      animation-delay: 0s;
      transform: rotate(35deg);
    }

    .shooting-star:nth-child(5) {
      top: 30%;
      left: -20%;
      animation-delay: 1s;
      transform: rotate(40deg);
    }

    .shooting-star:nth-child(6) {
      top: 60%;
      left: -15%;
      animation-delay: 2s;
      transform: rotate(30deg);
    }

    .shooting-star:nth-child(7) {
      top: 80%;
      left: -25%;
      animation-delay: 3s;
      transform: rotate(45deg);
    }

    @keyframes shoot {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0);
      }
      10% {
        opacity: 1;
      }
      70% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate3d(1400px, 600px, 0);
      }
    }

    /* Content in the center */
    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 600px;
      z-index: 10;
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 12px #a259ff);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #a259ff;
      text-shadow: 0 0 12px #a259ff;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
    }

    /* Subtle bottom gradient to suggest horizon */
    .horizon {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30%;
      background: radial-gradient(ellipse at bottom, rgba(40,40,40,0.6), transparent);
      opacity: 0.7;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="sky">
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <!-- Multiple shooting stars for a meteor-shower feel -->
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>

    <div class="content">
      <img src="images/realitychecklogo.png" class="logo" alt="Reality Check Logo">
      <h1>Reality Check</h1>
      <p>Our full site is being built right now.<br>
      We’re getting everything ready to launch something powerful, transparent, and built to help people who need it most.</p>
      <p>Thank you for your patience.</p>
    </div>

    <div class="horizon"></div>
  </div>
</body>
</html>
